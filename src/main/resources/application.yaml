server:
  port: 8081

spring:
  application:
    name: ms-productos

  datasource:
    url: jdbc:mysql://mysql-devgear:3306/productos_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&useUnicode=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/e5372bf0-c5e3-4286-887c-79069f209c1f/v2.0

  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: 5672
    username: guest
    password: guest
    virtual-host: /

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: "1"            # navegacion.eventos tolera perder algún click; prioriza velocidad
      retries: 3
      properties:
        max.block.ms: 2000          # si Kafka no responde, no cuelga la petición HTTP
        delivery.timeout.ms: 5000
        request.timeout.ms: 3000
        linger.ms: 5

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
